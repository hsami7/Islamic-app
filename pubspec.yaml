name: islamic_app
description: "All-in-one Islamic app: Quran, Prayer Times, Qibla, Azkar"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter

  # Core
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  provider: ^6.1.2

  # Location & sensors
  geolocator: ^12.0.0
  flutter_compass: ^0.8.0

  # Notifications
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4

  # Storage
  shared_preferences: ^2.3.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Media
  audioplayers: ^6.1.0

  # UI & assets
  flutter_svg: ^2.0.10
  flutter_launcher_icons: ^0.13.1

  # Utilities
  intl: ^0.20.2
  permission_handler: ^11.3.1
  connectivity_plus: ^6.0.5
  easy_localization: ^3.0.7

  # Quran text rendering
  flutter_html: ^3.0.0-beta.2
  adhan: ^2.0.0+1
  hijri: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.12
  integration_test:
    sdk: flutter
  mockito: ^5.4.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/
    - assets/lang/
    - assets/icons/

  fonts:
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
    - family: NotoSansArabic
      fonts:
        - asset: assets/fonts/NotoSansArabic-Regular.ttf
        - asset: assets/fonts/NotoSansArabic-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21